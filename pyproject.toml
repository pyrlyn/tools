[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrlyn-tools"
version = "0.1.0"
description = "Shared development helpers for pyrlyn Rust repositories: cargo cache report, swarfr cleanup, cargo-sweep, CPU count"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/pyrlyn/tools"

[project.scripts]
ptools = "ptools.cli:main"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ptools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Strict typing is enforced by `just typecheck` (and CI): every function is annotated and
# `from __future__ import annotations` is used in each module. tools/list.py is a standalone
# uv script with its own dependency and is not part of the package.
[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

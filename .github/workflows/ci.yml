name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # pyrlyn/ci ci-rust.yml: fmt once, then clippy, check and tests per target. No build logic here.
  rust:
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@9748fe1e5a2007d695e4e1a1d9b16492660dd8bc # main 2026-10-11 (mold input)
    permissions:
      contents: read
      actions: write # cancel-run on failure
    secrets: inherit
    with:
      mold: true # mold + clang on Linux runners (mise.toml [env])
      rust-version: "1.98.1" # same pin as mise.toml
      matrix: >-
        [
        {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
        {"os": "macos-latest", "target": "aarch64-apple-darwin"},
        {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      xcode-version: "" # public repo: macos-latest has Xcode 26.x, the xcode-27 image is not available
      feature-args: ""
      clippy-args: --locked

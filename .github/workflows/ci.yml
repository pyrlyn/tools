name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # pyrlyn/ci ci-rust.yml: fmt once, then clippy, check and tests per target. No build logic here.
  rust:
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@ce98c614219bfad8253cfec3530565c470745ed5
    permissions:
      contents: read
      actions: write # cancel-run on failure
    secrets: inherit
    with:
      rust-version: "1.98.1" # same pin as mise.toml
      matrix: >-
        [
        {"os": "ubuntu-latest", "target": "x86_64-unknown-linux-gnu"},
        {"os": "macos-latest", "target": "aarch64-apple-darwin"},
        {"os": "windows-latest", "target": "x86_64-pc-windows-msvc"}
        ]
      feature-args: ""
      clippy-args: --locked
